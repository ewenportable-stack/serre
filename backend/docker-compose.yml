services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: changeme123
      DOCKER_INFLUXDB_INIT_ORG: serre
      DOCKER_INFLUXDB_INIT_BUCKET: serre
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-change-me
    volumes:
      - influxdb-data:/var/lib/influxdb2

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/serre.db
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: dev-token-change-me
      INFLUX_ORG: serre
      INFLUX_BUCKET: serre
    volumes:
      - backend-data:/data
    depends_on:
      - mosquitto
      - influxdb

volumes:
  mosquitto-data:
  influxdb-data:
  backend-data:
